services:
  paddle-ocr:
    build:
      context: ./ocr-service
    ports:
      - "8001:8001"
    environment:
      PADDLEOCR_LANG: pt
      PADDLEOCR_API_TOKEN: ${PADDLEOCR_TOKEN:-}
    volumes:
      - paddle_models:/root/.paddlex
      - paddle_models_legacy:/root/.paddleocr
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pricescan_redis:/data
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    volumes:
      - pricescan_n8n:/home/node/.n8n
volumes:
  paddle_models:
  paddle_models_legacy:
  pricescan_redis:
  pricescan_n8n:
